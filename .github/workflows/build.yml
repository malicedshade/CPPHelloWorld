name: Build C

on:
  push:
    branches: "**"
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y -f build-essential g++ cmake
  build:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build project
        run: g++ ./hello.c -o chello.out
